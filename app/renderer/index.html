<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>haxballRL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="../assets/header.svg" alt="haxballRL - Play against RL-trained bots">
  </header>

  <main>
    <!-- step 1: pick a mode -->
    <section id="pick">
      <h2>Bots</h2>
      <p id="notice" class="notice" hidden></p>
      <div id="modes" class="modes"></div>
    </section>

    <!-- step 2: room settings -->
    <section id="settings" hidden>
      <h2 id="settingsTitle">Room</h2>
      <div class="fields">
        <label class="wide">Room name
          <input id="roomName" type="text" placeholder="haxballRL" maxlength="40" spellcheck="false">
        </label>
        <label>Password
          <input id="password" type="text" value="bot" maxlength="30" spellcheck="false">
        </label>
        <label>Max players
          <input id="maxPlayers" type="number" min="1" max="12" value="4">
        </label>
      </div>
    </section>

    <!-- step 3: the room -->
    <section id="live" hidden>
      <h2 id="liveTitle">Your room</h2>
      <p id="status" class="status">Starting…</p>
      <p id="countdown" class="countdown" hidden></p>
      <div id="linkBox" class="linkbox" hidden>
        <div class="row"><span class="k">Link</span><code id="link"></code></div>
        <div class="row"><span class="k">Password</span><code id="pw"></code></div>
        <div class="row buttons">
          <button id="open" class="secondary">Open in browser</button>
          <button id="copy" class="secondary">Copy link</button>
        </div>
      </div>
      <div id="botBox" class="botbox" hidden>
        <div class="bots">Bots <span id="botCount" class="count">1 / 2</span></div>
        <div class="commands">
          <button id="removeBot" class="cmd">Remove</button>
          <button id="addBot" class="cmd">Add</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <button id="play" class="cmd primary" disabled>Play</button>
    <button id="create" class="cmd primary" hidden>Create room</button>
    <button id="back" class="cmd" hidden>Back</button>
    <button id="closeRoom" class="cmd primary" hidden>Close room</button>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
